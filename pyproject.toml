[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mes-reversal-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=0.9.86",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
